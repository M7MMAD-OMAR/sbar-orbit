<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Original native applications on numbered workspaces</title><desc id="desc">Architecture illustration, not a screenshot. Two workspaces share the existing desktop session. Orbit requests an original application on workspace 2. Input and capture remain held.</desc><rect width="1200" height="620" rx="28" fill="#f4f3ed"/><g font-family="sans-serif" fill="#173c56"><text x="60" y="66" font-size="27" font-weight="700">One existing OS desktop session</text><text x="60" y="100" font-size="18">Architecture diagram, not a screenshot or proof of input</text><rect x="60" y="140" width="510" height="360" rx="22" fill="#e1ece8" stroke="#527f6a" stroke-width="2"/><text x="88" y="185" font-size="24">Workspace 1</text><text x="88" y="218" font-size="18">Your current work</text><rect x="98" y="254" width="430" height="200" rx="12" fill="#fffdf8" stroke="#527f6a"/><path d="M124 288h240m-240 32h170m-170 32h300m-300 32h220" stroke="#8ca79d" stroke-width="9"/><rect x="630" y="140" width="510" height="360" rx="22" fill="#fae5d8" stroke="#b87354" stroke-width="2"/><text x="658" y="185" font-size="24">Workspace 2</text><text x="658" y="218" font-size="18">Original installed application</text><rect x="710" y="260" width="350" height="190" rx="12" fill="#fffdf8" stroke="#b87354" stroke-width="2"/><path d="M710 300h350" stroke="#b87354"/><text x="735" y="287" font-size="16">Floating window</text><text x="735" y="345" font-size="19">Normal owner state</text><text x="735" y="380" font-size="19">Bounded, measured size</text><text x="60" y="555" font-size="20">MCP / CLI → Orbit broker → registered launch → window acknowledgement</text><text x="60" y="589" font-size="17">Pointer, keyboard, capture and account acceptance: not measured</text></g></svg>
