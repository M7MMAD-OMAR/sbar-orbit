<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Original native applications on numbered workspaces</title><desc id="desc">Architecture illustration, not a screenshot. Blue gradient edges illustrate the original activity design; sizes are schematic. Two workspaces share the existing desktop session. Orbit requests an original application on workspace 2. Input and capture use an exact application handoff.</desc><defs><linearGradient id="glow-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#255fce" stop-opacity=".80"/><stop offset=".18" stop-color="#255fce" stop-opacity=".45"/><stop offset=".4" stop-color="#255fce" stop-opacity=".20"/><stop offset=".68" stop-color="#255fce" stop-opacity=".07"/><stop offset="1" stop-color="#255fce" stop-opacity="0"/></linearGradient><linearGradient id="glow-bottom" href="#glow-top" x1="0" y1="1" x2="0" y2="0"/><linearGradient id="glow-left" href="#glow-top" x1="0" y1="0" x2="1" y2="0"/><linearGradient id="glow-right" href="#glow-top" x1="1" y1="0" x2="0" y2="0"/><clipPath id="workspace-clip"><rect x="630" y="140" width="510" height="360" rx="22"/></clipPath></defs><rect width="1200" height="620" rx="28" fill="#f4f3ed"/><g font-family="sans-serif" fill="#173c56"><text x="60" y="66" font-size="27" font-weight="700">One existing OS desktop session</text><text x="60" y="100" font-size="18">Architecture diagram, not a screenshot or proof of input</text><rect x="60" y="140" width="510" height="360" rx="22" fill="#e1ece8" stroke="#527f6a" stroke-width="2"/><text x="88" y="185" font-size="24">Workspace 1</text><text x="88" y="218" font-size="18">Your current work</text><rect x="98" y="254" width="430" height="200" rx="12" fill="#fffdf8" stroke="#527f6a"/><path d="M124 288h240m-240 32h170m-170 32h300m-300 32h220" stroke="#8ca79d" stroke-width="9"/><rect x="630" y="140" width="510" height="360" rx="22" fill="#fae5d8"/><g clip-path="url(#workspace-clip)"><rect x="630" y="140" width="510" height="52" fill="url(#glow-top)"/><rect x="630" y="448" width="510" height="52" fill="url(#glow-bottom)"/><rect x="630" y="140" width="52" height="360" fill="url(#glow-left)"/><rect x="1088" y="140" width="52" height="360" fill="url(#glow-right)"/></g><text x="658" y="185" font-size="24">Workspace 2</text><text x="658" y="218" font-size="18">Original browser, terminal or application</text><rect x="710" y="260" width="350" height="190" rx="12" fill="#fffdf8" stroke="#b87354" stroke-width="2"/><path d="M710 300h350" stroke="#b87354"/><text x="735" y="287" font-size="16">Floating window</text><text x="735" y="345" font-size="19">Normal owner state</text><text x="735" y="380" font-size="19">Bounded, measured size</text><circle cx="1010" cy="410" r="21" fill="none" stroke="#255fce" stroke-width="3"/><path d="M1010 410v27l8-7 6 12 6-3-7-12h13z" fill="#255fce" stroke="#fffdf8" stroke-width="2"/><text x="658" y="480" font-size="16">Soft edge glow, workspace label and click ring</text><text x="60" y="555" font-size="20">MCP / CLI → Orbit broker → registered launch → request-bound window evidence</text><text x="60" y="589" font-size="17">Shared system clipboard; verify actual input, capture and account state</text></g></svg>
