name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install website test dependencies
        working-directory: website
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check types
        run: bun run typecheck
      - name: Diagnose Windows socket ACL environment
        if: runner.os == 'Windows'
        run: bun run scripts/limited.ts bun experiments/windows-socket-diagnostic.ts
      # Use the same bounded entry point on every platform. The command's exit
      # status is the job result, with no echo or tolerated failure masking it.
      - name: Run the bounded suite
        run: bun experiments/verify-with-resources.ts
      - name: Preserve runner resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-resources-${{ matrix.os }}
          path: output/verification-resources.jsonl
          if-no-files-found: warn

  registered-hosts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install and negotiate every generated host entry
        run: bun run scripts/limited.ts bun experiments/registered-hosts.ts

  installed-browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install, register hosts and use the managed browser
        run: bun experiments/installed-ci-acceptance.ts
      - name: Preserve installer report and browser frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-acceptance-${{ matrix.os }}
          path: output/installed-acceptance/
          if-no-files-found: warn
