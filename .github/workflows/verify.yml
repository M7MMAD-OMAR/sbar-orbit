name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify, or all supported runners
        type: choice
        default: all
        options: [all, ubuntu-24.04, windows-latest, macos-latest]
      macos-bun-version:
        description: Bun version for a controlled macOS runtime comparison
        type: string
        default: '1.3.14'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-24.04","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ runner.os == 'Windows' && '1.4.2' || runner.os == 'macOS' && inputs.macos-bun-version || '1.3.14' }}
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install website test dependencies
        working-directory: website
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build current website for rendered onboarding tests
        working-directory: website
        run: bun run ../scripts/limited.ts bun run build
      - name: Check types
        run: bun run typecheck
      # Desktop product tests are bounded. Native runtime tests require the separate
      # Fedora witness; platform contract success does not certify native input.
      - name: Run desktop product contracts
        run: bun run verify
      - name: Run website content tests
        run: bun run scripts/limited.ts bun run --cwd website qa
      - name: Check website types
        run: bun run scripts/limited.ts bun run --cwd website typecheck

  registered-hosts:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-24.04","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ runner.os == 'Windows' && '1.4.2' || runner.os == 'macOS' && inputs.macos-bun-version || '1.3.14' }}
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install and negotiate every generated host entry
        run: bun run scripts/limited.ts bun experiments/registered-hosts.ts

  packaging-and-platform-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-24.04","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ runner.os == 'Windows' && '1.4.2' || runner.os == 'macOS' && inputs.macos-bun-version || '1.3.14' }}
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      # Retain packaging, installer and service-path guards on all three hosts.
      # The retired installed-browser gate is not desktop runtime acceptance.
      - name: Verify package and installation contracts
        run: bun run verify tests/packaging.test.ts tests/agent-contract.test.ts tests/service-paths.test.ts tests/macos-service-simulation.test.ts

  native-selection-guard:
    # This compiled Linux gate remains mandatory on every main/PR verification.
    # Provision headers in a disposable capped container, never via host sudo.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Provision isolated Wayland development files
        run: |
          mkdir -p output/native-selection-sysroot
          bun run scripts/limited.ts docker run --rm --cpus=2 --memory=2g --memory-swap=2g --pids-limit=256 \
            --mount "type=bind,source=$PWD/output/native-selection-sysroot,target=/sysroot" \
            ubuntu:24.04 bash -ceu '
              apt-get update -qq
              cd /tmp
              apt-get download libwayland-dev libwayland-server0 libwayland-client0 libwayland-cursor0 libwayland-egl1 libwayland-bin
              for package in ./*.deb; do dpkg-deb --extract "$package" /sysroot; done
            '
      - name: Compile and verify selection lifetime guards in the shared budget
        run: |
          command -v g++
          command -v pkg-config
          export PKG_CONFIG_SYSROOT_DIR="$PWD/output/native-selection-sysroot"
          export PKG_CONFIG_LIBDIR="$PKG_CONFIG_SYSROOT_DIR/usr/lib/x86_64-linux-gnu/pkgconfig"
          export LD_LIBRARY_PATH="$PKG_CONFIG_SYSROOT_DIR/usr/lib/x86_64-linux-gnu"
          bun run verify tests/native-selection-guard.test.ts
