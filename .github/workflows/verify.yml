name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify, or all supported runners
        type: choice
        default: all
        options: [all, ubuntu-24.04, windows-latest, macos-latest]
      macos-bun-version:
        description: Bun version for a controlled macOS runtime comparison
        type: string
        default: '1.3.14'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-24.04","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ runner.os == 'Windows' && '1.4.2' || runner.os == 'macOS' && inputs.macos-bun-version || '1.3.14' }}
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install website test dependencies
        working-directory: website
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check types
        run: bun run typecheck
      - name: Diagnose Windows socket ACL environment
        if: runner.os == 'Windows'
        run: bun run scripts/limited.ts bun experiments/windows-socket-diagnostic.ts
      # Use the same bounded entry point on every platform. The command's exit
      # status is the job result, with no echo or tolerated failure masking it.
      - name: Run the bounded suite
        run: bun experiments/verify-with-resources.ts
      - name: Preserve runner resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-resources-${{ matrix.os }}
          path: output/verification-resources.jsonl
          if-no-files-found: warn

  registered-hosts:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-24.04","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ runner.os == 'Windows' && '1.4.2' || runner.os == 'macOS' && inputs.macos-bun-version || '1.3.14' }}
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install and negotiate every generated host entry
        run: bun run scripts/limited.ts bun experiments/registered-hosts.ts

  installed-browser:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-24.04","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ runner.os == 'Windows' && '1.4.2' || runner.os == 'macOS' && inputs.macos-bun-version || '1.3.14' }}
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install, register hosts and use the managed browser
        run: bun run scripts/limited.ts bun experiments/installed-ci-acceptance.ts
      - name: Preserve macOS service failure details
        if: failure() && runner.os == 'macOS'
        run: |
          mkdir -p output/installed-acceptance
          cp "$HOME/Library/Logs/sbar-orbit/broker.log" output/installed-acceptance/broker.log 2>/dev/null || true
          launchctl print "gui/$(id -u)/com.sbar.orbit.broker" > output/installed-acceptance/launchd.txt 2>&1 || true
          ps -axo pid,ppid,stat,pcpu,rss,comm > output/installed-acceptance/processes.txt
      - name: Preserve installer report and browser frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-acceptance-${{ matrix.os }}
          path: output/installed-acceptance/
          if-no-files-found: warn

  macos-scheduling:
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'macos-latest' }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.macos-bun-version || '1.3.14' }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Compare verified browser scheduling classes
        run: |
          mkdir -p output
          bun run scripts/limited.ts bun experiments/macos-qos-cost.ts 3 > output/macos-scheduling.json
      - name: Preserve scheduling comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-scheduling
          path: output/macos-scheduling.json
          if-no-files-found: warn
