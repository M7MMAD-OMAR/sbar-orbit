name: Build reviewed release artifacts

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact reviewed 40-hex commit ID, never a branch or tag
        required: true
        type: string
      version:
        description: Exact version in that commit's root package.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      RELEASE_VERSION: ${{ inputs.version }}
      WORKFLOW_REF: ${{ github.sha }}
    steps:
      - name: Validate inputs and hosted resources before setup or installation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Full lowercase commit ID required'; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo 'Invalid version'; exit 1; }
          cat > "$RUNNER_TEMP/release-resource-preflight.py" <<'PY'
          import json, os, shutil
          from pathlib import Path
          mem = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          available = int(mem['MemAvailable'].split()[0]) * 1024
          load = os.getloadavg()[0]
          cpus = os.cpu_count() or 0
          full = next(line for line in Path('/proc/pressure/memory').read_text().splitlines() if line.startswith('full '))
          psi = float(next(part.split('=')[1] for part in full.split() if part.startswith('avg10=')))
          disk = shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          print(json.dumps({'availableMemoryBytes': available, 'cpuCount': cpus, 'load1': load, 'memoryFullAvg10': psi, 'diskFreeBytes': disk}))
          if available < 5 * 1024**3 or cpus < 2 or load > cpus * 1.5 or psi > 1 or disk < 6 * 1024**3:
              raise SystemExit('Hosted resource gate refused; no unbounded fallback')
          PY
          python3 "$RUNNER_TEMP/release-resource-preflight.py"
          systemctl is-system-running --wait || test "$(systemctl is-system-running)" = degraded
          test -f /sys/fs/cgroup/cgroup.controllers
          sudo -n true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Check exact source identity before executing project tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          test "$(git cat-file -t "$SOURCE_REF")" = commit
          git merge-base --is-ancestor "$SOURCE_REF" refs/remotes/origin/main
          bun -e 'const p=await Bun.file("package.json").json(); if(p.name!=="sbar-orbit"||p.version!==process.env.RELEASE_VERSION)throw Error("Root version mismatch");'
          test "$(bun --version)" = 1.3.14
      - name: Create isolated serial build script and enforced hosted budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-home" "$RUNNER_TEMP/release-smoke" "$RUNNER_TEMP/release-bun-cache"
          cat > "$RUNNER_TEMP/build-release.sh" <<'BUILD'
          #!/usr/bin/env bash
          set -euo pipefail
          umask 077
          cd "$BUILD_SOURCE"
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          test -z "$(git status --porcelain --untracked-files=no)"
          bun -e 'const {requireResourceBudget}=await import("./src/resource-budget.ts"); const b=await requireResourceBudget(); if(b.memoryBytes!==1610612736||b.cpuCores>1.5||b.swapBytes!==0||b.tasks>256)throw Error("Wrong hosted cgroup budget");'
          # Hosted-only fixture prerequisites, inside the same enforced cgroup. No upgrades or desktop packages.
          sudo -n env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo -n env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y --no-install-recommends --no-upgrade libwayland-dev libluajit-5.1-2 luajit pkg-config gcc
          pkg-config --exists wayland-server
          command -v gcc
          command -v luajit
          # Serial only. All descendants stay inside the same kernel-enforced slice.
          bun install --frozen-lockfile --ignore-scripts
          (cd website && bun install --frozen-lockfile --ignore-scripts)
          bun run scripts/limited.ts bun run typecheck
          bun run verify
          bun run verify tests/packaging.test.ts tests/public-audit.test.ts tests/registry-package-ref.test.ts
          bun run scripts/limited.ts bun run --cwd website typecheck
          bun run scripts/limited.ts bun test website/tests
          bun run scripts/limited.ts bun run --cwd website build
          export SITE_OUTPUT="$BUILD_SOURCE/output/site"
          mkdir -p "$SITE_OUTPUT"
          bun run - <<'JS'
          import {createHash} from "node:crypto";
          import {join} from "node:path";
          import {lstat,readdir} from "node:fs/promises";
          import {immutableTarArguments} from "./scripts/package-source.ts";
          const version=process.env.RELEASE_VERSION, directory=process.env.SITE_OUTPUT;
          let count=0,total=0,entries=0;
          async function walk(path,depth=0) {
            const root=await lstat(path);
            if(!root.isDirectory()||root.isSymbolicLink()||depth>32)throw Error("Invalid site directory");
            for(const name of await readdir(path)) {
              if(++entries>5000)throw Error("Site entry count exceeds bounds");
              const file=join(path,name),info=await lstat(file);
              if(info.isSymbolicLink())throw Error("Site output symlink refused");
              if(info.isDirectory())await walk(file,depth+1);
              else if(info.isFile()) { if(++count>5000||(total+=info.size)>128*1024*1024)throw Error("Site output exceeds bounds"); }
              else throw Error("Invalid site output entry");
            }
          }
          await walk("website/dist");
          if(!count||!(await Bun.file("website/dist/index.html").exists())||!(await Bun.file("website/dist/ar/index.html").exists()))throw Error("Missing bilingual site output");
          const name="sbar-orbit-site-"+version+".tar.gz",archive=join(directory,name);
          const child=Bun.spawn(await immutableTarArguments("/usr/bin/tar",archive,join(process.env.BUILD_SOURCE,"website"),"dist"),{stdout:"inherit",stderr:"inherit",env:{...process.env,TAR_OPTIONS:undefined,GZIP:undefined}});
          if(await child.exited)throw Error("Site archive failed");
          const bytes=await Bun.file(archive).arrayBuffer(),sha256=createHash("sha256").update(Buffer.from(bytes)).digest("hex");
          await Bun.write(archive+".sha256",sha256+"  "+name+"\n");
          await Bun.write(join(directory,"site-verification.json"),JSON.stringify({schema:1,version,sourceCommit:process.env.SOURCE_REF,workflowCommit:process.env.WORKFLOW_REF,bunVersion:Bun.version,files:count,unpackedBytes:total,archive:{name,bytes:bytes.byteLength,sha256},verification:{typecheck:true,tests:true,build:true,deployed:false}},null,2)+"\n");
          JS
          test -z "$(git status --porcelain --untracked-files=no)"
          bun run scripts/limited.ts bun scripts/package.ts --ref "$SOURCE_REF"
          bun run scripts/limited.ts bun scripts/registry-package.ts output/packages --ref "$SOURCE_REF"
          export ASSET_DIRECTORY="$BUILD_SOURCE/output/packages"
          bun run - <<'JS'
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const directory=process.env.ASSET_DIRECTORY, version=process.env.RELEASE_VERSION;
          for(const name of ['sbar-orbit-'+version+'-source.tar.gz','sbar-orbit-'+version+'.tgz']) {
            const sha=createHash('sha256').update(Buffer.from(await Bun.file(join(directory,name)).arrayBuffer())).digest('hex');
            const expected=sha+'  '+name+'\n', file=join(directory,name+'.sha256');
            if(await Bun.file(file).exists() && await Bun.file(file).text()!==expected)throw Error('Existing checksum mismatch');
            await Bun.write(file,expected);
          }
          JS
          # Paths derive from validated inputs, not archive entries.
          mkdir "$SMOKE_ROOT/source" "$SMOKE_ROOT/registry"
          tar xzf "$ASSET_DIRECTORY/sbar-orbit-$RELEASE_VERSION-source.tar.gz" -C "$SMOKE_ROOT/source"
          tar xzf "$ASSET_DIRECTORY/sbar-orbit-$RELEASE_VERSION.tgz" -C "$SMOKE_ROOT/registry"
          export SOURCE_SMOKE="$SMOKE_ROOT/source/sbar-orbit-$RELEASE_VERSION-source"
          export REGISTRY_SMOKE="$SMOKE_ROOT/registry/package"
          bun run - <<'JS'
          import { join } from 'node:path';
          const source=process.env.SOURCE_SMOKE, registry=process.env.REGISTRY_SMOKE;
          const {readVerifiedSource}=await import(join(source,'scripts/source-manifest.ts'));
          const verified=await readVerifiedSource(source);
          const manifest=await Bun.file(join(source,'SOURCE-MANIFEST.json')).json();
          const receipt=await Bun.file(join(registry,'SOURCE-COMMIT.json')).json();
          for(const item of [manifest,receipt])if(item.version!==process.env.RELEASE_VERSION||item.sourceCommit!==process.env.SOURCE_REF)throw Error('Artifact source identity mismatch');
          if(verified.version!==process.env.RELEASE_VERSION||receipt.schema!==1)throw Error('Invalid artifact identity');
          for(const root of [source,registry]) {
            const pkg=await Bun.file(join(root,'package.json')).json();
            if(pkg.name!=='sbar-orbit'||pkg.version!==process.env.RELEASE_VERSION||!(await Bun.file(join(root,'bun.lock')).exists()))throw Error('Artifact package mismatch');
          }
          JS
          for root in "$SOURCE_SMOKE" "$REGISTRY_SMOKE"; do
            (cd "$root" && bun install --frozen-lockfile --ignore-scripts)
            SMOKE_PACKAGE="$root" bun run - <<'JS'
          import { join } from 'node:path';
          const root=process.env.SMOKE_PACKAGE;
          async function call(args) {
            const child=Bun.spawn([join(root,'bin/sbar-orbit'),...args],{cwd:root,stdout:'pipe',stderr:'pipe'});
            const [out,err,code]=await Promise.all([new Response(child.stdout).text(),new Response(child.stderr).text(),child.exited]);
            if(code!==0&&code!==1)throw Error('Unexpected smoke exit');
            return {out,code};
          }
          const help=await call(['help']); if(help.code!==0||!help.out.includes('Sbar Orbit'))throw Error('Launcher help failed');
          const preflight=await call(['preflight']); const p=JSON.parse(preflight.out);
          if(p.sessionMode!=='desktop-only'||p.browserPrerequisitesFound!==false||typeof p.nativePrerequisitesFound!=='boolean'||preflight.code!==(p.nativePrerequisitesFound?0:1))throw Error('Preflight contract failed');
          const install=await call(['install','--dry-run','--no-service','--json','--prefix',join(process.env.HOME,'dry-run-prefix')]);
          const report=JSON.parse(install.out);
          if(report.dryRun!==true||typeof report.installed!=='boolean'||!Array.isArray(report.steps)||report.steps.some(x=>x.state==='failed')||install.code!==(report.installed?0:1))throw Error('Dry-run install failed');
          JS
          done
          # Upload aggregate identity/evidence only, never smoke logs, caches or owner data.
          bun run - <<'JS'
          import {createHash} from 'node:crypto';
          import {join} from 'node:path';
          const directory=process.env.ASSET_DIRECTORY,version=process.env.RELEASE_VERSION;
          const names=['sbar-orbit-'+version+'-source.tar.gz','sbar-orbit-'+version+'-source.tar.gz.sha256','sbar-orbit-'+version+'.tgz','sbar-orbit-'+version+'.tgz.sha256'];
          const assets=[];for(const name of names){const bytes=await Bun.file(join(directory,name)).arrayBuffer();assets.push({name,bytes:bytes.byteLength,sha256:createHash('sha256').update(Buffer.from(bytes)).digest('hex')});}
          await Bun.write(join(directory,'release-verification.json'),JSON.stringify({schema:1,version,sourceCommit:process.env.SOURCE_REF,workflowCommit:process.env.WORKFLOW_REF,bunVersion:Bun.version,verification:{typecheck:true,defaultVerify:true,packagingVerify:true,sourceManifest:true,registrySourceReceipt:true,frozenInstall:true,help:true,preflightContract:true,installDryRun:true,nativeAcceptance:false},budget:{memoryBytes:1610612736,cpuQuotaPercent:150,tasks:256,swapBytes:0},assets},null,2)+'\n');
          JS
          BUILD
          chmod 700 "$RUNNER_TEMP/build-release.sh"
          printf '[Unit]\nDescription=Owned hosted Orbit release budget\n[Slice]\nCPUAccounting=true\nMemoryAccounting=true\nCPUQuota=150%%\nMemoryMax=1536M\nMemorySwapMax=0\nTasksMax=256\n' | sudo tee /run/systemd/system/sbarorbit.slice >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl start sbarorbit.slice
          # A real ephemeral runner user manager, never a forged fixture socket.
          uid="$(id -u)"; account="$(id -un)"; runtime="/run/user/$uid"
          if [[ ! -S "$runtime/systemd/private" ]]; then
            sudo loginctl enable-linger "$account"
            sudo systemctl start "user@$uid.service"
          fi
          test -d "$runtime"
          test "$(stat -c %u "$runtime")" = "$uid"
          test -S "$runtime/systemd/private"
          env XDG_RUNTIME_DIR="$runtime" DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus" systemctl --user start dbus.socket
          test -S "$runtime/bus"
          env XDG_RUNTIME_DIR="$runtime" DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus" systemctl --user show-environment >/dev/null
          env XDG_RUNTIME_DIR="$runtime" DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus" busctl --user status >/dev/null
      - name: Verify and package exact commit inside the enforced budget
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/release-resource-preflight.py"
          sudo systemd-run --quiet --wait --pipe --collect --unit="orbit-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --slice=sbarorbit.slice --uid="$(id -u)" --gid="$(id -g)" \
            --property=CPUQuota=150% --property=MemoryMax=1536M --property=MemorySwapMax=0 --property=TasksMax=256 \
            --setenv="PATH=$PATH" --setenv="HOME=$RUNNER_TEMP/release-home" \
            --setenv="XDG_RUNTIME_DIR=/run/user/$(id -u)" --setenv="DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" \
            --setenv="BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/release-bun-cache" --setenv="ORBIT_BUN=$(command -v bun)" \
            --setenv="SOURCE_REF=$SOURCE_REF" --setenv="RELEASE_VERSION=$RELEASE_VERSION" --setenv="WORKFLOW_REF=$WORKFLOW_REF" \
            --setenv="BUILD_SOURCE=$GITHUB_WORKSPACE" --setenv="SMOKE_ROOT=$RUNNER_TEMP/release-smoke" \
            /bin/bash "$RUNNER_TEMP/build-release.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ inputs.version }}-${{ inputs.source_ref }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            output/packages/sbar-orbit-${{ inputs.version }}-source.tar.gz
            output/packages/sbar-orbit-${{ inputs.version }}-source.tar.gz.sha256
            output/packages/sbar-orbit-${{ inputs.version }}.tgz
            output/packages/sbar-orbit-${{ inputs.version }}.tgz.sha256
            output/packages/release-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orbit-site-${{ inputs.version }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            output/site/sbar-orbit-site-${{ inputs.version }}.tar.gz
            output/site/sbar-orbit-site-${{ inputs.version }}.tar.gz.sha256
            output/site/site-verification.json
