# One question, on a real Mac: does an Orbit browser launch reach for the person's Keychain?
#
# `docs/support-tiers.md` records the no dialog claim as **Reasoned, not measured**. The reasoning is
# vendor source and it is sound, and it has never been observed on a Mac. This workflow is the
# observation, and it is deliberately narrow about what it can observe.
#
# A GitHub macOS runner is a virtual Mac with no person at it, no logged in Apple ID and a Keychain
# that is nobody's. It CANNOT show that no modal dialog appears on a person's real account. What it
# can show is every mechanical step behind that claim: the switches in the argv the KERNEL reports
# for the browser Orbit started, whether the `Chrome Safe Storage` item is created or modified by a
# launch, and how a launch with those switches REMOVED differs. The last of those is the experiment;
# the rest is bookkeeping around it.
#
# Started by hand, never on push to `main`, and allowed to fail: the log is the result, not a merge
# gate. The `push` trigger is scoped to this project's agent branches for one reason: GitHub resolves
# `workflow_dispatch` only against the DEFAULT branch, so a workflow that has never been merged cannot
# be started by hand at all, and an unrunnable workflow is exactly the "not measured" trap this repo
# is judged on.
name: verify-macos-keychain
on:
  workflow_dispatch:
  push:
    branches:
      - "hermes-subagent/**"
    paths:
      - ".github/workflows/verify-macos-keychain.yml"
      - "experiments/macos-keychain.ts"
      - "tests/macos-keychain.test.ts"
      - "src/chrome.ts"
jobs:
  keychain:
    strategy:
      fail-fast: false
      matrix:
        # Two Macs, because one runner's Keychain policy is one machine's and this measurement is
        # about a policy. `macos-latest` is Apple silicon; `macos-15-intel` is a different host class
        # and a different keychain implementation path to fall over on.
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      # The website is a separate workspace. Without it one test file fails to resolve
      # react/jsx-dev-runtime, which is a missing dependency rather than a macOS result. The same
      # note the Windows and macOS jobs in platform-probes.yml already carry.
      - run: cd website && bun install --frozen-lockfile --ignore-scripts
      - run: mkdir -p output/keychain
      # What is on this machine before anything of Orbit's runs. A runner with no Chrome is a runner
      # that measures nothing, and a runner whose keychain already holds a Safe Storage item is a
      # different experiment from one that does not: both are recorded rather than assumed.
      - name: the machine, before
        run: |
          set +e
          {
            echo "== sw_vers"; sw_vers
            echo "== uname"; uname -m
            echo "== browsers"; ls -d /Applications/*.app 2>/dev/null | head -40
            echo "== user keychains"; security list-keychains -d user
            echo "== default keychain"; security default-keychain -d user
            echo "== Chrome Safe Storage, attributes only, never -g or -w"
            security find-generic-password -s "Chrome Safe Storage"; echo "find exit $?"
          } 2>&1 | tee output/keychain/before.log
      # The argv assertions run on every platform, so they run here too and this is the first host
      # where the darwin only half of the file is not a skip.
      - name: the Keychain test file, inside the budget
        continue-on-error: true
        run: |
          set +e
          (bun run scripts/limited.ts bun test tests/macos-keychain.test.ts; echo "suite exit $?") 2>&1 | tee output/keychain/suite.log
      # The negative control, in plain shell, run BEFORE the experiment so the item is absent when it
      # starts. Two arms differing only by the two switches, each starting from a deleted item, so
      # "this arm created Chrome Safe Storage" is a fact about the arm rather than about step order.
      # If nothing differs between the arms, that is the finding and it is recorded as one.
      - name: a launch with the mock keychain switch stripped
        continue-on-error: true
        run: |
          set +e
          {
            CHROME="$(ls -d /Applications/Google*Chrome.app/Contents/MacOS/* 2>/dev/null | head -1)"
            echo "browser: ${CHROME:-none}"
            if [ -n "$CHROME" ]; then
              for arm in flagged stripped; do
                PROFILE="$(mktemp -d)"
                if [ "$arm" = "flagged" ]; then KEYS="--use-mock-keychain --password-store=basic"; else KEYS=""; fi
                echo "== arm $arm, switches: ${KEYS:-none}"
                # Each arm starts from an ABSENT item, so "created by this arm" is unambiguous. The
                # first version of this step ran after the experiment, which had already created the
                # item in its own stripped arm, so both arms read "present" and the control proved
                # nothing. This is a runner's throwaway keychain and nobody's real one.
                security delete-generic-password -s "Chrome Safe Storage" >/dev/null 2>&1
                echo "-- item before this arm"; security find-generic-password -s "Chrome Safe Storage" >/dev/null 2>&1; echo "present before: $? (44 is absent)"
                START=$(date +%s)
                "$CHROME" --user-data-dir="$PROFILE" --headless --remote-debugging-port=0 \
                  --remote-debugging-address=127.0.0.1 --no-first-run --no-default-browser-check \
                  --disable-background-networking $KEYS --disable-crash-reporter \
                  --disable-features=MediaRouter --disable-extensions about:blank > "$PROFILE/out.log" 2>&1 &
                PID=$!
                for i in $(seq 1 120); do [ -s "$PROFILE/DevToolsActivePort" ] && break; sleep 0.5; done
                END=$(date +%s)
                if [ -s "$PROFILE/DevToolsActivePort" ]; then echo "endpoint published after $((END-START)) s"; else echo "NO ENDPOINT after $((END-START)) s"; fi
                echo "-- command line the kernel reports"
                ps -p $PID -o command= | tr ' ' '\n' | grep -E 'keychain|password-store' || echo "(no keychain switch in argv)"
                echo "-- what Chrome said about the keychain"
                grep -iE 'keychain|os_crypt|errSec|-25308' "$PROFILE/out.log" | tail -5 || true
                kill -9 $PID 2>/dev/null
                echo "-- Chrome Safe Storage after this arm"
                security find-generic-password -s "Chrome Safe Storage"; echo "find exit $?"
                rm -rf "$PROFILE"
              done
            fi
          } 2>&1 | tee output/keychain/negative-control.log
      # The measurement. Exit code is recorded and not acted on: a harness exits 0 for completing its
      # steps, and the verdict inside the JSON is what says anything.
      - name: the experiment
        continue-on-error: true
        run: |
          set +e
          (bun run scripts/limited.ts bun run experiments/macos-keychain.ts; echo "experiment exit $?") 2>&1 | tee output/keychain/experiment.log
      - name: the machine, after
        if: always()
        run: |
          set +e
          {
            echo "== user keychains"; security list-keychains -d user
            echo "== Chrome Safe Storage, attributes only"
            security find-generic-password -s "Chrome Safe Storage"; echo "find exit $?"
            echo "== nothing of this run's own is left behind"
            security find-generic-password -s "Orbit Keychain Probe"; echo "probe item find exit $? (44 is absent, which is correct)"
          } 2>&1 | tee output/keychain/after.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-macos-keychain-${{ matrix.os }}
          path: output/keychain/
