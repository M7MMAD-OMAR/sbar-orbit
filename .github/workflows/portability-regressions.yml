name: portability-regressions

on:
  push:
    branches: [agents/external-install-portability]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  old-and-fixed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prove service and package regressions on old and fixed source
        shell: python
        run: |
          import json, pathlib, re, subprocess
          output = pathlib.Path('output/portability-regressions')
          output.mkdir(parents=True, exist_ok=True)
          cases = [
              ('service-paths', 'src/service.ts', 'tests/broker-environment.test.ts',
               'broker and updater retain selected installer paths when the manager environment differs', 1, 'expect(received)'),
              ('service-validation', 'src/service.ts', 'tests/broker-environment.test.ts',
               'service path selection ignores empty and relative optional directories and refuses control characters', 1, 'expect(received)'),
              ('package-assets', 'package.json', 'tests/packaging.test.ts',
               'the registry tarball carries tracked source and nothing the working tree happened to leave behind', 1, 'expect(received)'),
          ]
          evidence = []
          for name, source, test, pattern, expected_failures, assertion_marker in cases:
              path = pathlib.Path(source)
              fixed = path.read_bytes()
              old = subprocess.check_output(['git', 'show', 'ea4a017f208a1ea121faabec31ead73301dec6f7:' + source])
              try:
                  path.write_bytes(old)
                  command = ['bun', 'run', 'scripts/limited.ts', 'bun', 'test', test, '-t', pattern]
                  red = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180)
                  (output / (name + '-old.log')).write_bytes(red.stdout)
                  text = re.sub(r'\x1b\[[0-9;]*m', '', red.stdout.decode(errors='replace'))
                  failures = re.search(r'^\s*(\d+) fail\s*$', text, re.MULTILINE)
                  if red.returncode == 0 or not failures or int(failures[1]) != expected_failures or assertion_marker not in text:
                      raise RuntimeError(name + ': old source did not produce the expected assertion failures')
              finally:
                  path.write_bytes(fixed)
              green = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180)
              (output / (name + '-fixed.log')).write_bytes(green.stdout)
              if green.returncode != 0:
                  raise RuntimeError(name + ': fixed source failed')
              evidence.append({'case': name, 'oldExit': red.returncode, 'fixedExit': green.returncode,
                               'oldSource': 'ea4a017f208a1ea121faabec31ead73301dec6f7',
                               'fixedSource': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
                               'limit': 'injected path and registry fixtures on Ubuntu; real applications not measured'})
              (output / 'results.json').write_text(json.dumps(evidence, indent=2) + '\n')
      - name: Check candidate types and focused publication contracts
        run: |
          bun run scripts/limited.ts bun run typecheck > output/portability-regressions/typecheck.log 2>&1
          bun run verify tests/broker-environment.test.ts tests/unit-drift.test.ts tests/unit-directory.test.ts tests/packaging.test.ts tests/public-audit.test.ts tests/source-manifest.test.ts > output/portability-regressions/contracts.log 2>&1
      - name: Preserve old and fixed regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-regressions
          path: output/portability-regressions/
          if-no-files-found: error
