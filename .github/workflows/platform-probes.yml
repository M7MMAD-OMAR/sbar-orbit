name: Platform probes

# Manual only. Runs every TypeScript unit test file on its own on Windows and macOS runners and
# records one line per file, so a platform regression names the file instead of hiding in one
# red number. This is a source and service contract run: it controls no desktop application and
# certifies no native control on either platform.

on:
  workflow_dispatch:
    inputs:
      filter:
        description: Regular expression selecting test file names (empty runs all)
        required: false
        default: ""
      systems:
        description: JSON array of runner labels
        required: false
        default: '["windows-latest","macos-latest","ubuntu-24.04"]'

permissions:
  contents: read

jobs:
  per-file-tests:
    name: Unit tests per file (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.systems || '["windows-latest","macos-latest","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Broker smoke (private broker, doctor over its endpoint)
        shell: bash
        run: bun run scripts/limited.ts bun run scripts/platform-smoke.ts
      - name: Launcher help (the launcher of this platform starts Bun)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bin/sbar-orbit.cmd help | head -5; else bin/sbar-orbit help | head -5; fi
      - name: Run each test file separately
        shell: bash
        env:
          ORBIT_TEST_FILTER: ${{ inputs.filter }}
        run: bun run scripts/platform-test-report.ts "${{ matrix.os }}"
      - name: Windows account probes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          whoami.exe /user /fo csv /nh; "exit=$LASTEXITCODE"
          bun -e "const r=Bun.spawnSync(['whoami.exe','/user','/fo','csv','/nh']); console.log(r.exitCode, r.stdout.toString(), r.stderr.toString())"
          tar --version; (Get-Command tar).Source; "$env:SystemRoot\System32\tar.exe --version"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-tests-${{ matrix.os }}
          path: output/platform-tests/
