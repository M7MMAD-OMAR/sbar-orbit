# The hosts this project does not have: a Windows, a macOS and a real Ubuntu machine, borrowed from
# GitHub's runners for the length of one probe run. This is not continuous integration and runs no
# suite; it answers the platform gates in docs/porting.md that need those hosts, and uploads one JSON
# report per platform for docs/support-tiers.md. Started by hand, never on push.
name: platform-probes
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat sway xwayland xterm foot grim python3 binutils > /dev/null
      - run: bun run experiments/platform-probe/run.ts
        env:
          ORBIT_PROBE_RELEASE: ${{ github.event.inputs.release || 'v0.1.0-alpha.5' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-probe-${{ matrix.os }}
          path: output/platform-probe/
  # The suite on a real Windows host, which is the half the probe job above never covered: it answers
  # gate questions and runs no tests. Every Windows result in docs/windows-measured.md was measured on
  # one Windows 11 guest on the owner's workstation, so nothing outside that machine would notice a
  # regression. This is a second Windows host, and a different one: a GitHub runner, no Edge profile of
  # its own, a different Bun, and no state from any earlier run.
  #
  # Allowed to fail, and the log is the result. It is not a gate on merging: it is the thing that says
  # a Windows claim stopped being true, in a place other than one person's VM.
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      # The website is a separate workspace. Without it one test file fails to resolve react/jsx-dev-runtime,
      # which is a missing dependency rather than a Windows result, and it cost a debugging round on the guest.
      - run: cd website && bun install --frozen-lockfile --ignore-scripts
      - name: typecheck, the documented plan command, and the suite
        shell: cmd
        run: |
          mkdir output\verify
          (bun run typecheck & echo typecheck exit %errorlevel%) > output\verify\typecheck.log 2>&1
          (install.cmd --dry-run --json & echo install dry-run exit %errorlevel%) > output\verify\install-dry-run.log 2>&1
          (bun test & echo suite exit %errorlevel%) > output\verify\suite.log 2>&1
          type output\verify\suite.log
      # A real install and a real browser session, the way section 20 and section 22 measured them by
      # hand. `verify` is skipped on Windows by design, so the install is expected to exit 0 with no
      # managed broker, and the broker is started explicitly here the way a person would.
      - name: install, then drive a browser session through the installed command
        shell: pwsh
        continue-on-error: true
        run: |
          $prefix = Join-Path $env:LOCALAPPDATA "orbit-ci"
          cmd /c "install.cmd --json --prefix ""$prefix""" | Tee-Object output/verify/install.log
          $launcher = Join-Path $prefix "bin\sbar-orbit.cmd"
          $serve = Start-Process -FilePath $launcher -ArgumentList "serve","--managed-socket" -PassThru -WindowStyle Hidden -RedirectStandardOutput output/verify/serve.out -RedirectStandardError output/verify/serve.err
          $socket = $null
          for ($i = 0; $i -lt 120 -and -not $socket; $i++) {
            Start-Sleep -Milliseconds 500
            $line = Get-Content output/verify/serve.out -EA SilentlyContinue | Select-Object -First 1
            if ($line) { try { $socket = ($line | ConvertFrom-Json).socket } catch {} }
          }
          if (-not $socket) { Get-Content output/verify/serve.err -EA SilentlyContinue; throw "the broker never published a socket" }
          $env:ORBIT_SOCKET = $socket
          & $launcher status --json | Tee-Object output/verify/status.log
          $created = & $launcher session create browser | Tee-Object output/verify/session-create.log | Out-String
          $id = ([regex]::Match($created, "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}")).Value
          if (-not $id) { throw "no session was created" }
          # act takes ID then one JSON document, and cmd is used because PowerShell strips the inner
          # quotes before the process sees them. Measured on the guest: both the CLI and the launcher
          # failed identically under PowerShell, which is what proved it was the shell.
          $action = '{""type"":""navigate"",""url"":""https://example.com/""}'
          cmd /c """$launcher"" act $id ""$action""" | Tee-Object output/verify/act.log
          & $launcher session observe $id --output "$PWD/output/verify/frame.jpg"
          & $launcher session observe $id --metadata | Tee-Object output/verify/observe.log
          & $launcher session stop $id
          Stop-Process -Id $serve.Id -Force -EA SilentlyContinue
          # A frame that exists is not a frame that rendered: a blank 6758 byte JPEG passed a byte count
          # check on the guest while the navigation had silently never happened. Size is a floor, and the
          # metadata above is what says which page it is.
          $bytes = (Get-Item output/verify/frame.jpg).Length
          "frame bytes: $bytes"
          if ($bytes -lt 10000) { throw "the frame is too small to be a rendered page: $bytes bytes" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-windows-latest
          path: output/verify/
  # The suite on a real Mac, which is the half the probe job above never covered: it answers gate
  # questions and runs no tests. Every macOS claim before this came from `experiments/platform-probe/`
  # on a runner, which launched a browser and never once ran Orbit's own code against it.
  #
  # Allowed to fail, and the log is the result. It is not a gate on merging: it is the thing that says
  # a macOS claim stopped being true.
  verify-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      # The website is a separate workspace, exactly as the Windows job records: without it one test
      # file fails to resolve react/jsx-dev-runtime, which is a missing dependency rather than a macOS
      # result.
      - run: cd website && bun install --frozen-lockfile --ignore-scripts
      - name: typecheck, the documented plan command, and the suite inside the budget
        run: |
          mkdir -p output/verify
          (bun run typecheck; echo "typecheck exit $?") 2>&1 | tee output/verify/typecheck.log
          (./install.sh --dry-run --json; echo "install dry-run exit $?") 2>&1 | tee output/verify/install-dry-run.log
          # `bun run verify`, not `bun test`: the whole point of the macOS budget work is that a bare
          # `bun test` must refuse with RESOURCE_LIMIT_REQUIRED there exactly as it does on Linux, and
          # running the suite through the budget is what proves the registry path works on a real Mac.
          (bun run verify; echo "verify exit $?") 2>&1 | tee output/verify/verify.log
      # A bare `bun test` has to REFUSE. If this exits 0 the budget is not being required on macOS,
      # which is a defect in the thing the suite above just claimed to exercise.
      - name: a bare suite run is refused without a budget
        run: |
          set +e
          bun test tests/resources.test.ts > output/verify/unbudgeted.log 2>&1
          echo "bare bun test exit $?" | tee -a output/verify/unbudgeted.log
      # The real install, the launch agent, and one browser session driven through the installed
      # command, the way a person would. This is the macOS half of gate 3.
      - name: install, then drive a browser session through the installed command
        continue-on-error: true
        run: |
          (./install.sh --json; echo "install exit $?") 2>&1 | tee output/verify/install.log
          sleep 5
          (set +e; launchctl print "gui/$(id -u)/com.sbar.orbit.broker"; echo "agent print $?"; \
            ls -la "$HOME/Library/Application Support/sbar-orbit/" 2>&1; \
            cat "$HOME/Library/LaunchAgents/com.sbar.orbit.broker.plist" 2>&1; \
            cat "$HOME/Library/Logs/sbar-orbit/broker.log" 2>&1) 2>&1 | tee output/verify/service.log
          export ORBIT_SOCKET="$HOME/Library/Application Support/sbar-orbit/broker.sock"
          (bun run src/cli.ts doctor; echo "doctor exit $?") 2>&1 | tee output/verify/doctor.log
          export ORBIT_AGENT_NAME=runner ORBIT_TASK_NAME="the macOS gate"
          (set +e; ID=$(bun run src/cli.ts session create browser | tee output/verify/session-create.log | sed -n 's/.*"sessionId": *"\([^"]*\)".*/\1/p' | head -1); echo "session $ID"; \
            bun run src/cli.ts act "$ID" '{"type":"navigate","url":"https://example.com/"}'; bun run src/cli.ts act "$ID" '{"type":"read","selector":"h1"}'; \
            bun run src/cli.ts session observe "$ID" --output "$PWD/output/verify/frame.jpg"; \
            bun run src/cli.ts session observe "$ID" --metadata | tee output/verify/observe.log; \
            bun run src/cli.ts session stop "$ID"; echo "session exit $?") 2>&1 | tee output/verify/session.log
          (bun run src/cli.ts status --json; echo "status exit $?") 2>&1 | tee output/verify/status.log
          # A frame that exists is not a frame that rendered. The Windows job learned this from a blank
          # 6758 byte JPEG that passed a byte count check while the navigation had never happened, so
          # the floor is a floor and the metadata above says which page it is.
          bytes=$(stat -f%z output/verify/frame.jpg 2>/dev/null || echo 0)
          echo "frame bytes: $bytes" | tee -a output/verify/session.log
          if [ "$bytes" -lt 10000 ]; then echo "the frame is too small to be a rendered page"; exit 1; fi
      # Containment, measured rather than asserted: kill the broker outright and count what is left.
      - name: nothing owned survives a killed broker
        continue-on-error: true
        run: |
          (bun run scripts/limited.ts bun run experiments/macos-reaping.ts; echo "reaping exit $?") 2>&1 | tee output/verify/reaping.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-macos-latest
          path: output/verify/
  # The suite itself, on a real Ubuntu host: the runner's user manager delegates cpu, memory and pids,
  # so scripts/limited.ts may be able to make the slice it needs. Allowed to fail; the log is the result.
  verify-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts && (cd website && bun install --frozen-lockfile --ignore-scripts)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat grim wl-clipboard > /dev/null
      - run: |
          mkdir -p output/verify
          (bun run typecheck; echo "typecheck exit $?") 2>&1 | tee output/verify/typecheck.log
          (./install.sh --dry-run --json; echo "install dry-run exit $?") 2>&1 | tee output/verify/install-dry-run.log
          (bun run verify; echo "verify exit $?") 2>&1 | tee output/verify/verify.log
          cp -r "$HOME/.local/state/sbar-orbit/diagnostics" output/verify/diagnostics 2>/dev/null || true
      # The other half of gate 3 for the browser path: a real systemd user session that is not this
      # workstation. The one command install, the service it starts, doctor, and one browser session.
      - run: |
          (./install.sh --json; echo "install exit $?") 2>&1 | tee output/verify/install.log
          sleep 5
          (set +e; systemctl --user is-active sbar-orbit.service; echo "service $?"; systemctl --user status sbar-orbit.service --no-pager -l; journalctl --user -u sbar-orbit.service --no-pager -n 80; cat "$HOME/.config/systemd/user/sbar-orbit.service"; ls -la "$XDG_RUNTIME_DIR/sbar-orbit/" 2>&1) 2>&1 | tee output/verify/service.log
          export ORBIT_SOCKET="$XDG_RUNTIME_DIR/sbar-orbit/broker.sock"
          (bun run src/cli.ts doctor; echo "doctor exit $?") 2>&1 | tee output/verify/doctor.log
          export ORBIT_AGENT_NAME=runner ORBIT_TASK_NAME="gate 3 on a runner"
          (set +e; ID=$(bun run src/cli.ts session create browser | tee output/verify/session-create.log | sed -n 's/.*"sessionId": *"\([^"]*\)".*/\1/p' | head -1); echo "session $ID"; \
            bun run src/cli.ts act "$ID" '{"type":"navigate","url":"https://example.com/"}'; bun run src/cli.ts act "$ID" '{"type":"read","selector":"h1"}'; \
            bun run src/cli.ts session observe "$ID" --output "$PWD/output/verify/frame.jpg"; bun run src/cli.ts session stop "$ID"; echo "session exit $?") 2>&1 | tee output/verify/session.log
          (bun run src/cli.ts status; echo "status exit $?") 2>&1 | tee output/verify/status.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-ubuntu-24.04
          path: output/verify/
