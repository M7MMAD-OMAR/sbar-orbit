name: macOS capture diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-capture-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install website test dependencies
        working-directory: website
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check types
        run: bun run typecheck
      - name: Observe unchanged capture budget on one disposable runner
        run: bun --smol run scripts/limited.ts bun --smol experiments/macos-capture-diagnostic.ts
      - name: Retain exact-source actual observations even when a fixture fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-capture-diagnostic-${{ github.run_id }}
          path: output/macos-capture-diagnostic/
          if-no-files-found: error
