name: macOS capture diagnostic
on:
  push:
    branches: [agents/startup-reliability-c38c]
    paths:
      - '.github/workflows/macos-capture-diagnostic.yml'
      - 'experiments/macos-capture-diagnostic.ts'
      - 'experiments/capture-browser-copy.ts'
      - 'experiments/capture-diagnostic-record.ts'
      - 'tests/**'
      - 'src/**'
      - 'scripts/limited.ts'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'website/package.json'
      - 'website/bun.lock'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-capture-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install website test dependencies
        working-directory: website
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check types
        run: bun run typecheck
      - name: Observe unchanged capture budget with an owned fixture-only app bundle copy
        env:
          ORBIT_CAPTURE_CONTROLLED_BROWSER: '1'
          ORBIT_TEST_NATIVE: '0'
        run: bun --smol run scripts/limited.ts bun --smol experiments/macos-capture-diagnostic.ts
      - name: Retain exact-source actual observations even when a fixture fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-capture-diagnostic-${{ github.run_id }}
          path: output/macos-capture-diagnostic/
          if-no-files-found: error
