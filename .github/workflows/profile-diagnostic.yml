name: profile diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        probe: [isolated, full-suite, isolation-contracts]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install website test dependencies
        working-directory: website
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check types
        run: bun run typecheck
      - name: Install existing Linux selection callback test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++ pkg-config libwayland-dev
      - name: Record exact source and production tree identity
        run: |
          mkdir -p output/profile-diagnostic
          git rev-parse HEAD > output/profile-diagnostic/commit.txt
          git status --porcelain > output/profile-diagnostic/worktree-before.txt
          bun --version > output/profile-diagnostic/bun-version.txt
          uname -a > output/profile-diagnostic/kernel.txt
          command -v google-chrome > output/profile-diagnostic/browser-command.txt
          google-chrome --version > output/profile-diagnostic/browser-version.txt
          sha256sum /opt/google/chrome/chrome > output/profile-diagnostic/browser-binary.sha256
          git ls-tree -r HEAD -- src package.json bun.lock bunfig.toml scripts/limited.ts > output/profile-diagnostic/production-tree.txt
          sha256sum experiments/profile-diagnostic-preload.ts tests/profiles.test.ts > output/profile-diagnostic/instrumentation-before.sha256
          sha256sum src/chrome.ts src/browser-startup-diagnostic.ts > output/profile-diagnostic/startup-before.sha256
      - name: Observe saved-account boundaries with the verification runtime
        env:
          PROBE: ${{ matrix.probe }}
          ORBIT_PROFILE_TRACE: '1'
          ORBIT_BROWSER_STARTUP_TRACE: '1'
          ORBIT_BROWSER_STARTUP_TRACE_ROOT: '__diagnostic_saved_profile_only__'
        run: |
          if [ "$PROBE" = isolation-contracts ]; then
            if timeout --signal=TERM --kill-after=5s 120s env -u ORBIT_BROWSER_STARTUP_TRACE_ROOT bun --smol run scripts/limited.ts bun --smol test tests/viewer-setup-cleanup.test.ts tests/browser-startup-diagnostic.test.ts > output/profile-diagnostic/profile.log 2>&1
            then
              result=0
            else
              result=$?
            fi
            if [ "$result" -eq 0 ]; then
              if timeout --signal=TERM --kill-after=5s 120s bun --smol run scripts/limited.ts bun --smol test tests/viewer-setup-cleanup.test.ts >> output/profile-diagnostic/profile.log 2>&1
              then
                result=0
              else
                result=$?
              fi
            fi
            sha256sum experiments/profile-diagnostic-preload.ts tests/profiles.test.ts > output/profile-diagnostic/instrumentation-after.sha256
            sha256sum src/chrome.ts src/browser-startup-diagnostic.ts > output/profile-diagnostic/startup-after.sha256
            if ! cmp -s output/profile-diagnostic/startup-before.sha256 output/profile-diagnostic/startup-after.sha256; then
              printf '%s\n' 'Startup source changed during probe' > output/profile-diagnostic/source-drift.txt
              result=2
            fi
            git status --porcelain > output/profile-diagnostic/worktree-after.txt
            printf '%s\n' "$result" > output/profile-diagnostic/exit-code.txt
            cat output/profile-diagnostic/profile.log
            exit "$result"
          fi
          if [ "$PROBE" = isolated ]; then
            set -- tests/profiles.test.ts
          else
            set --
          fi
          if timeout --signal=TERM --kill-after=5s 900s bun --smol run scripts/limited.ts bun --smol test --preload ./experiments/profile-diagnostic-preload.ts "$@" > output/profile-diagnostic/profile.log 2>&1
          then
            result=0
          else
            result=$?
          fi
          sha256sum experiments/profile-diagnostic-preload.ts tests/profiles.test.ts > output/profile-diagnostic/instrumentation-after.sha256
          sha256sum src/chrome.ts src/browser-startup-diagnostic.ts > output/profile-diagnostic/startup-after.sha256
          if ! cmp -s output/profile-diagnostic/startup-before.sha256 output/profile-diagnostic/startup-after.sha256; then
            printf '%s\n' 'Startup source changed during probe' > output/profile-diagnostic/source-drift.txt
            result=2
          fi
          git status --porcelain > output/profile-diagnostic/worktree-after.txt
          printf '%s\n' "$result" > output/profile-diagnostic/exit-code.txt
          cat output/profile-diagnostic/profile.log
          exit "$result"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-diagnostic-${{ matrix.probe }}-${{ github.run_id }}
          path: output/profile-diagnostic/
          if-no-files-found: error
