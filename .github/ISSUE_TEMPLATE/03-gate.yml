name: Native capability evidence
description: A measured result, failure or partial result for a current native adapter capability.
labels: ["type:gate"]
body:
  - type: markdown
    attributes:
      value: |
        Use the [current adapter contract](https://github.com/M7MMAD-OMAR/sbar-orbit/blob/main/docs/porting.md)
        and [acceptance procedure](https://github.com/M7MMAD-OMAR/sbar-orbit/blob/main/docs/acceptance-procedure.md).
        Record the source, actual host, exact original application and observed operation.
        An API reference supports an implementation choice; it does not prove application delivery.
        Retired browser, private-session and isolation gates are not current acceptance criteria.
  - type: dropdown
    id: gate
    attributes:
      label: Capability
      options:
        - Original application discovery and registration
        - Request-bound opening and floating geometry
        - Native handoff and target-bound input
        - Capture and actual application result
        - Visible workspace, activity indicator and agent pointer
        - Shared clipboard and original application state
        - Dialogs, exact cleanup and owner activity
        - Permissions, recovery and safe update lifecycle
        - A new native platform adapter
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Measured for the stated host, source and operation
        - Failed, with the actual failure retained
        - Partial, and I state exactly what is still open
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Exact command, source and host versions, observable result, cleanup and limits. Distinguish fixtures from original application measurements. Redact private data.
    validations:
      required: true
