name: Native application bug
description: A discovery, opening, control or lifecycle operation failed or contradicted its documented behavior.
labels: ["type:bug", "needs:report-bundle"]
body:
  - type: markdown
    attributes:
      value: |
        Compare the exact operation with the [current support matrix](https://github.com/M7MMAD-OMAR/sbar-orbit/blob/main/docs/support-tiers.md)
        and [acceptance index](https://github.com/M7MMAD-OMAR/sbar-orbit/blob/main/docs/acceptance.md).
        Include the Orbit version, OS, compositor, application registration and observed result.
        Another host can reveal a real defect; use form 02 for a broader platform measurement.
  - type: textarea
    id: report
    attributes:
      label: Capability report
      description: |
        `sbar-orbit doctor --report > ~/orbit-report.json`, then paste it here. Write it outside the work
        tree. Review and redact it before posting. Do not upload account state, personal paths,
        document contents, credentials, raw worker logs or private screenshots.
      render: json
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: The command you ran
      placeholder: sbar-orbit native-open JSON, native handoff, or bun run verify
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
      description: Quote the error, not a description of it. If a test failed, paste the failing test's output.
    validations:
      required: true
  - type: checkboxes
    id: read
    attributes:
      label: Before you send it
      options:
        - label: I read the report above before pasting it, and it contains nothing I would not publish.
          required: true
        - label: Sensitive input, permission or credential disclosures go through SECURITY.md privately.
          required: true
