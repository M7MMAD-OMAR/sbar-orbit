name: Platform test report
description: Report source, installation or native application measurements on a named OS and desktop.
labels: ["type:platform-report", "needs:report-bundle"]
body:
  - type: markdown
    attributes:
      value: |
        State which capability you exercised: discovery, installation, registered opening,
        input, capture, visible workspace presentation, shared clipboard or exact cleanup.
        Compare with [current support](https://github.com/M7MMAD-OMAR/sbar-orbit/blob/main/docs/support-tiers.md).
        Windows/macOS source and installation checks do not establish native desktop control.
        One application result applies to its named host, source and operation.
  - type: dropdown
    id: platform
    attributes:
      label: Host class
      options:
        - Linux, another glibc distribution
        - Linux, musl
        - Linux, rootless container or atomic host
        - Windows
        - macOS
        - Something else
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Worked
        - Worked inside a limit I describe below
        - Refused at preflight, with a message
        - Crashed before preflight
        - Never started, no output
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Capability report, if Orbit ran far enough to print one
      description: |
        `sbar-orbit doctor --report > ~/orbit-report.json`. Optional on purpose: if Orbit never started,
        you cannot produce one, and that is itself the finding.
      render: json
  - type: textarea
    id: detail
    attributes:
      label: What you ran and what it did
      description: Include versions, exact operation, observable application result and cleanup. Source tests alone do not prove native control. Redact personal and account data.
    validations:
      required: true
